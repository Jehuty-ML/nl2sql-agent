# LumenLearn Demo · ClickHouse（本仓自带，问数可独立运行）
# 用法（在仓库根目录）：
#   docker compose -f infra/docker-compose.yml up -d
#   python scripts/generate_demo_data.py --seed 42 --to-clickhouse --truncate
#
# 账号：
#   lumen / lumen_demo     — 管理（仅造数脚本使用）
#   lumen_ro / lumen_ro_demo — Agent 只读（profile.readonly=1）

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: lumenlearn-clickhouse
    ports:
      - "8123:8123"   # HTTP（Agent / 造数脚本用这个）
      - "19000:9000"  # Native（本机 9000 常被 Hyper-V 保留，改映射到 19000）
    environment:
      CLICKHOUSE_DB: lumenlearn
      CLICKHOUSE_USER: lumen
      CLICKHOUSE_PASSWORD: lumen_demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - lumenlearn_ch_data:/var/lib/clickhouse
      # 只挂只读账号配置文件，避免整目录 :ro 导致 entrypoint 无法写 default-user.xml
      - ./clickhouse/users.d/readonly.xml:/etc/clickhouse-server/users.d/readonly.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  lumenlearn_ch_data:
